plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultraupscaler.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ultraupscaler.app'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1-enhanced'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
