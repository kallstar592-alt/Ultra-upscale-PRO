name: Install enhanced Android source
on:
  push:
    branches:
      - feature/enhanced-browser-tabs-16k-32k-adblock
    paths:
      - staging/source.ready
permissions:
  contents: write
jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expand source archive into repository root
        shell: bash
        run: |
          set -euo pipefail
          cat staging/source.part*.b64 | base64 --ignore-garbage --decode > /tmp/UltraUpscaler_Enhanced_Source.tar.gz
          mkdir -p /tmp/ultra-source
          tar -xzf /tmp/UltraUpscaler_Enhanced_Source.tar.gz -C /tmp/ultra-source
          test -f /tmp/ultra-source/UltraUpscaler_Enhanced/settings.gradle
          cp -a /tmp/ultra-source/UltraUpscaler_Enhanced/. .
          rm -rf staging
          rm -f .github/workflows/install-enhanced-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add enhanced Android browser source"
          git push origin "HEAD:${{ github.ref_name }}"
