name: Windows desktop build
on:
  push:
    branches:
      - feature/windows-pc-app-v1
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop app dependencies
        working-directory: pc
        run: npm install --no-audit --no-fund
      - name: Package Windows installer and portable EXE
        working-directory: pc
        run: npm run dist:win
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: ultra-upscale-pro-windows
          path: |
            pc/dist/*.exe
          if-no-files-found: error
          retention-days: 30
