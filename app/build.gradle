plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultraupscaler.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ultraupscaler.app.ai'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2-ai-experimental'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
